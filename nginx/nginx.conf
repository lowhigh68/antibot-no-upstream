# ============================================================
# /usr/local/openresty/nginx/conf/nginx.conf
#
# Kiến trúc đúng — terminate TLS tại nginx http layer:
#
#   Client → 192.168.168.123:443/80
#          → nginx http block (terminate TLS, JA3 capture)
#          → proxy_pass → Apache 127.0.0.1:8080/8081
#
# KHÔNG dùng stream block — stream TLS passthrough + proxy_protocol
# không đảm bảo lấy được IP thật ($remote_addr bị thay = 127.0.0.1)
#
# Với kiến trúc này:
#   $remote_addr = IP thật của client (luôn luôn, không cần realip module)
#   ssl_client_hello_by_lua_block = JA3 capture hoạt động bình thường
#   lua_package_path trong http{} = có hiệu lực với mọi phase
# ============================================================

user nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /usr/local/openresty/nginx/logs/error.log  warn;
pid        /usr/local/openresty/nginx/logs/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

# KHÔNG có stream block

http {
    include      /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    sendfile        on;
    client_max_body_size 50M;

    # Mặc định nginx là 8k/16k. Nâng lên 64k vì HAI lý do, và lý do thứ hai
    # đúng kể cả khi bỏ hết phần WAF đi:
    #
    #   1. `waf/body.lua` chỉ soi được body nằm trong BỘ NHỚ. Vượt buffer thì
    #      nginx ghi ra file tạm và `ngx.req.get_body_data()` trả nil; đọc file
    #      đó ở access phase là I/O CHẶN trên đường đi của mọi request nên không
    #      làm. Buffer to hơn = soi được nhiều hơn, không cần thêm dòng mã nào.
    #
    #   2. Body 16k–64k HÔM NAY đang bị ghi ra đĩa rồi mới đọc lại. Nâng buffer
    #      là BỚT một vòng ghi-đọc đĩa cho nhóm đó, kể cả khi không ai soi.
    #
    # Bộ đệm cấp cho TỪNG request có body và chỉ trong lúc đọc — không cấp trước
    # theo `worker_connections`. Trần bộ nhớ là (số upload đồng thời × 64k).
    #
    # `proxy_request_buffering` không được đặt ⇒ mặc định `on` ⇒ nginx VỐN ĐÃ
    # đệm trọn body trước khi gửi lên Apache. Nên `ngx.req.read_body()` không
    # thêm độ trễ nào — nó nhìn vào thứ đã nằm sẵn trong bộ nhớ.
    # (`proxy_buffering off` trong da_to_openresty.sh là đệm PHẢN HỒI, khác.)
    #
    # 64k là mốc KHỞI ĐẦU, không phải kết luận: cột `blen=`/`spill=` trong
    # waf.log sẽ cho phân bố thật để chỉnh lại có căn cứ.
    #
    # ── TẮT LẠI 2026-09-05, chưa bật cho tới khi có `cl=` ──────────────
    # Số liệu ngày đầu tiên KHÔNG khớp với mô hình ở trên, nên bật nó bây giờ là
    # chỉnh một tham số mà không hiểu nó chi phối cái gì:
    #     spill = 283/2270 = 12,5%
    #     nhưng body >64 KB đọc được vào bộ nhớ: 12 (tới 80.649 byte)
    # Với buffer mặc định 16k thì nhóm sau phải rơi ra file tạm hết. Không.
    #
    # Giả thuyết vừa dựng, CHƯA kiểm: `ngx.req.read_body()` của OpenResty đặt
    # `r->request_body_in_single_buf`, nên với request CÓ Content-Length nginx
    # cấp một buffer vừa đúng cỡ body và bỏ qua directive này. Chỉ request
    # CHUNKED (không có Content-Length) mới rơi về đây và mới spill. Khớp với
    # phép đo 02-09: 387 POST multipart trong 24h báo `cl=0`.
    #
    # Nếu đúng thì nâng buffer chỉ có tác dụng với nhóm chunked — vẫn đáng làm,
    # nhưng con số phải chọn theo phân bố CỦA NHÓM ĐÓ, không phải của tất cả.
    # Cột `cl=` vừa thêm vào dòng `[waf-body]` sẽ trả lời trong vài ngày:
    # spill có tương quan với `cl=-` hay không.
    #
    # Bỏ dấu `#` khi đã có câu trả lời. Đừng bỏ trước.
    # client_body_buffer_size 64k;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;
    server_names_hash_bucket_size 128;
    server_names_hash_max_size 1024;

    # /conf/?.lua → require("antibot.X") tìm /conf/antibot/X.lua ✓
    lua_package_path "/usr/local/openresty/nginx/conf/?.lua;/usr/local/openresty/nginx/conf/?/init.lua;/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/site/lualib/?/init.lua;/usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/?/init.lua;;";

    lua_package_cpath "/usr/local/openresty/site/lualib/?.so;/usr/local/openresty/lualib/?.so;;";

    lua_shared_dict  antibot_tls      10m;
    lua_shared_dict  whitelist_cache   1m;
    lua_shared_dict  antibot_stats     1m;
    lua_shared_dict  antibot_ua_cache  2m; 
    lua_shared_dict  antibot_cache    5m;

    lua_code_cache  on;

    resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=30s ipv6=off;
    resolver_timeout 1s;

    init_worker_by_lua_block {
        require("antibot").init_worker()
    }

    log_format  main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" ${request_time}s';

    log_format  antibot_fmt '$remote_addr [$time_local] "$request" $status score=$sent_http_x_bot_score action=$sent_http_x_bot_action fp=$sent_http_x_bot_fp tls13=$sent_http_x_bot_tls13 ja3_partial=$sent_http_x_bot_ja3partial ${request_time}s';

    log_format  bytes '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

    include /usr/local/openresty/nginx/conf/default.conf;
    include /usr/local/openresty/nginx/conf/hostname.conf;
    include /usr/local/openresty/nginx/conf/user/*/domains/*.conf;
}
