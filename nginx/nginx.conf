# ============================================================
# /usr/local/openresty/nginx/conf/nginx.conf
#
# Kiến trúc đúng — terminate TLS tại nginx http layer:
#
#   Client → 192.168.168.123:443/80
#          → nginx http block (terminate TLS, JA3 capture)
#          → proxy_pass → Apache 127.0.0.1:8080/8081
#
# KHÔNG dùng stream block — stream TLS passthrough + proxy_protocol
# không đảm bảo lấy được IP thật ($remote_addr bị thay = 127.0.0.1)
#
# Với kiến trúc này:
#   $remote_addr = IP thật của client (luôn luôn, không cần realip module)
#   ssl_client_hello_by_lua_block = JA3 capture hoạt động bình thường
#   lua_package_path trong http{} = có hiệu lực với mọi phase
# ============================================================

user nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /usr/local/openresty/nginx/logs/error.log  warn;
pid        /usr/local/openresty/nginx/logs/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

# KHÔNG có stream block

# ── thread_pool: ĐANG BẬT ───────────────────────────────────────────
# `waf/body.lua` đọc thân request đã tràn ra file tạm bằng
# `ngx.run_worker_thread`, để lấp một vùng mù mà `client_body_buffer_size`
# KHÔNG BAO GIỜ đóng được — buffer 64K thì kẻ tấn công độn 65K, 256K thì độn
# 257K. Đọc file ở access phase là I/O chặn trên đường đi của mọi request; đọc
# trong thread pool thì không.
#
# ĐIỀU KIỆN: OpenResty phải build với `--with-threads`. Thiếu nó thì đây là
# "unknown directive" → `nginx -t` hỏng. Xác nhận trên cloud168-101 05-09.
# Bước `[2b]` của deploy.sh kiểm điều kiện này TRƯỚC khi rsync và từ chối sớm
# nếu máy đích không có — để một máy khác build thiếu không làm hỏng nửa chừng
# một lần deploy. Kiểm tay:
#     /usr/local/openresty/nginx/sbin/nginx -V 2>&1 | grep -o -- --with-threads
#
# threads=2 để chặn số lần đọc 50 MiB đồng thời: mỗi lần đọc tốn (kích thước
# thân × 2) vì `body_core` cấp một bản sao lowercase, nên trần bộ nhớ là
# 2 × 2 × client_max_body_size. Spill đo được là ~283 lượt/ngày nên 2 thread dư
# sức; nâng lên chỉ nâng trần bộ nhớ chứ không nâng thông lượng cần thiết.
#
# Hàng đợi tràn thì báo `scan=spill_thread`, KHÔNG BAO GIỜ lùi về đọc chặn trên
# event loop. Muốn tắt lại: thêm dấu `#` — code tự báo `scan=nothread`, không
# hỏng gì.
thread_pool antibot_waf_io threads=2 max_queue=128;

http {
    include      /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    sendfile        on;
    client_max_body_size 50M;

    # ── client_body_buffer_size: ĐÃ BẬT LẠI 09-09, có số liệu ───────────
    # Bật 02-09, tắt 05-09 vì số liệu không khớp mô hình. Nay `wafstat.sh` mục
    # 8 đã chạy trên cả 5 máy (09-09, 23,5 giờ, ~100.000 POST) và trả lời.
    #
    # GIẢ THUYẾT CŨ ĐÃ BỊ BÁC BỎ. Nó nói: request CÓ Content-Length được
    # `request_body_in_single_buf` cấp buffer vừa cỡ body nên bỏ qua directive
    # này; chỉ request KHÔNG có Content-Length mới rơi về đây. Số liệu ngược
    # hẳn — **mọi** lượt spill đều CÓ Content-Length, và chunked thì KHÔNG
    # spill lần nào:
    #     spill=1  h1+CL 68/4/57/638/171   h2+CL 125/10/44/98/0
    #     spill=1  chunked                 0    (368 request chunked, 0 spill)
    #     spill=1  không có CL             0
    #
    # NGƯỠNG THẬT LÀ 8K, không phải 16k. Trên cloud186-126 và cloud183-139 số
    # spill khớp CHÍNH XÁC tổng ba nhóm ≥8K (101=18+38+45 và 14=2+10+2); ba máy
    # kia lệch 20–81, tức vài body ≥8K không spill (buckets là ước tính có hệ
    # số `smp=`, còn spill là số đếm thật — chênh đó là mẫu, không phải mâu
    # thuẫn). Kết luận: gần như mọi body ≥8K đang bị ghi ra đĩa rồi đọc lại.
    #
    # 64k xử lý dải 8k–64k = 1.115/1.215 lượt spill mỗi ngày trên toàn đàn máy.
    # Phần >64k (239 lượt) VẪN spill, và đó là đúng: body lớn nhất đọc được là
    # 3,5 MB — không có cỡ buffer nào nên ôm nhóm đó vào bộ nhớ.
    #
    # Bộ đệm cấp cho TỪNG request có body và chỉ trong lúc đọc, không cấp trước
    # theo `worker_connections` — trần là (upload đồng thời × 64k). Với ~1.200
    # body ≥8K mỗi ngày thì đồng thời là số nhỏ.
    #
    # `cl=-` KHÔNG đồng nghĩa chunked — header đó cũng vắng ở HTTP/2, HTTP/3 và
    # request không body; mục 8 đọc kèm `te=` và `proto=` nên số trên đọc được.
    client_body_buffer_size 64k;

    # Bẫy tên gọi, ghi ở đây vì nó là bẫy của nginx.conf: `proxy_request_
    # buffering` (đệm THÂN REQUEST) không được đặt ⇒ mặc định `on` ⇒ nginx VỐN
    # ĐÃ đệm trọn body trước khi gửi lên Apache, nên `ngx.req.read_body()` không
    # thêm độ trễ nào. Còn `proxy_buffering off` trong `da_to_openresty.sh` là
    # đệm PHẢN HỒI — directive khác, đọc nhầm thì kết luận ngược.
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;
    server_names_hash_bucket_size 128;
    server_names_hash_max_size 1024;

    # /conf/?.lua → require("antibot.X") tìm /conf/antibot/X.lua ✓
    lua_package_path "/usr/local/openresty/nginx/conf/?.lua;/usr/local/openresty/nginx/conf/?/init.lua;/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/site/lualib/?/init.lua;/usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/?/init.lua;;";

    lua_package_cpath "/usr/local/openresty/site/lualib/?.so;/usr/local/openresty/lualib/?.so;;";

    lua_shared_dict  antibot_tls      10m;
    lua_shared_dict  whitelist_cache   1m;
    lua_shared_dict  antibot_stats     1m;
    lua_shared_dict  antibot_ua_cache  2m; 
    lua_shared_dict  antibot_cache    5m;

    lua_code_cache  on;

    resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=30s ipv6=off;
    resolver_timeout 1s;

    init_worker_by_lua_block {
        require("antibot").init_worker()
    }

    log_format  main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" ${request_time}s';

    log_format  antibot_fmt '$remote_addr [$time_local] "$request" $status score=$sent_http_x_bot_score action=$sent_http_x_bot_action fp=$sent_http_x_bot_fp tls13=$sent_http_x_bot_tls13 ja3_partial=$sent_http_x_bot_ja3partial ${request_time}s';

    log_format  bytes '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

    include /usr/local/openresty/nginx/conf/default.conf;
    include /usr/local/openresty/nginx/conf/hostname.conf;
    include /usr/local/openresty/nginx/conf/user/*/domains/*.conf;
}
